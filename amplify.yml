# Configuracion de build para AWS Amplify.
# Las variables NEXT_PUBLIC_API_* se definen en la consola de Amplify, en
# App settings > Environment variables.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
